<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TDS-TOOL Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #00d2ff;
            --text-color: #f0f6fc;
            --text-secondary: #8b949e;
            --danger-color: #ff4d4d;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            background-color: rgba(0, 210, 255, 0.1);
            color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            border: 1px solid var(--accent-color);
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: #fff;
        }

        .result-box {
            margin-top: 12px;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 14px;
            word-break: break-all;
            display: none;
        }

        .code-display {
            font-family: monospace;
            font-size: 24px;
            letter-spacing: 2px;
            text-align: center;
            color: var(--accent-color);
            padding: 10px;
            background: #000;
            border-radius: 6px;
            margin-top: 8px;
        }

        nav {
            display: flex;
            justify-content: space-around;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 10px 0;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
        }

        .nav-item {
            color: var(--text-secondary);
            font-size: 12px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="title">⚡ TDS-TOOL</div>
        <div class="status-badge" id="statusBadge">Online</div>
    </header>

    <div class="container">
        <!-- SEZIONE CONNETTI WHATSAPP -->
        <div class="card">
            <div class="card-title">🔗 Connetti WhatsApp</div>
            <div class="input-group">
                <label for="phone">Numero di telefono (senza +)</label>
                <input type="tel" id="phone" placeholder="Es. 212604394833">
            </div>
            <button class="btn" onclick="generatePairingCode()">Genera codice d'associazione</button>
            
            <div id="pairResult" class="result-box">
                <div>Inserisci questo codice su WhatsApp:</div>
                <div class="code-display" id="pairingCode">- - - -</div>
            </div>
            <div id="pairError" class="result-box" style="color: var(--danger-color);"></div>
        </div>

        <!-- SEZIONE CHECK BAN -->
        <div class="card">
            <div class="card-title">🔍 Verifica Ban Numero</div>
            <div class="input-group">
                <label for="checkPhone">Numero da verificare</label>
                <input type="tel" id="checkPhone" placeholder="Es. 212604394833">
            </div>
            <button class="btn" style="background-color: #30363d; color: #fff;" onclick="checkBan()">Verifica Stato</button>
            <div id="checkResult" class="result-box"></div>
        </div>
    </div>

    <script>
        // Inizializzazione Telegram WebApp SDK
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // Il tuo nuovo URL del backend su Termux via Serveo
        const BACKEND_URL = "https://18319ff120e376f8-105-158-189-80.serveousercontent.com";

        // Funzione per generare il codice di associazione
        async function generatePairingCode() {
            let phoneInput = document.getElementById('phone').value.trim();
            const pairResult = document.getElementById('pairResult');
            const pairError = document.getElementById('pairError');
            const codeDisplay = document.getElementById('pairingCode');

            pairResult.style.display = 'none';
            pairError.style.display = 'none';

            // Pulisce il numero rimuovendo eventuali '+' o spazi
            phoneInput = phoneInput.replace(/[^0-9]/g, '');

            if (!phoneInput) {
                pairError.innerText = "❌ Inserisci un numero di telefono valido.";
                pairError.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/wa/pair`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: phoneInput })
                });

                const data = await response.json();

                if (data.success && data.code) {
                    codeDisplay.innerText = data.code;
                    pairResult.style.display = 'block';
                } else {
                    pairError.innerText = "❌ " + (data.error || "Errore nella generazione del codice.");
                    pairError.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                pairError.innerText = "❌ Errore di connessione al backend server.";
                pairError.style.display = 'block';
            }
        }

        // Funzione per la verifica del ban
        async function checkBan() {
            let phoneInput = document.getElementById('checkPhone').value.trim();
            const checkResult = document.getElementById('checkResult');
            
            checkResult.style.display = 'none';
            phoneInput = phoneInput.replace(/[^0-9]/g, '');

            if (!phoneInput) {
                alert("Inserisci un numero valido");
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/wa/checkban`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: phoneInput })
                });

                const data = await response.json();
                checkResult.innerText = data.exists ? "✅ Il numero è attivo su WhatsApp." : "⚠️ Il numero potrebbe essere bannato o non registrato.";
                checkResult.style.display = 'block';
            } catch (err) {
                checkResult.innerText = "❌ Impossibile verificare lo stato.";
                checkResult.style.display = 'block';
            }
        }
    </script>
</body>
</html>
